name: Windows x64 CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "vendor/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netwatch-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Windows x64 / VS 2022
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure (VS 2022 x64)
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build-ci --config Release --parallel

      - name: Run CTest regressions
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Publish test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: netwatch-windows-ctest-log
          path: build-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
